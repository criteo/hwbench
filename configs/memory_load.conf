# Intention: the power and thermal limits of the CPU fully loaded for 10 minutes
# This configuration tries to maximize both CPU and Memory power consumption.
[global]
runtime=600
monitor=all

[full_memory_load]
# engine stressng: see documentation/stressng.md#modules
engine=stressng
engine_module=stream
# every logical CPU of the target machine: see documentation/configuration.md#selected_cpus
selected_cpus=all
# all of them loaded at once in a single benchmark: see documentation/cpu-selection.md#none-load-everything-at-once
selected_cpus_scaling=none
# one stream worker per logical CPU, the whole CPU fully loaded: see documentation/configuration.md#stressor_range
stressor_range=auto

