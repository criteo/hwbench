# Intention: a scaling curve of every stress-ng module, from one physical core to all of them, after an idle reference
[global]
runtime=120
monitor=all
engine=stressng
# every physical core of the CPU, one group each: see documentation/cpu-selection.md#each-core-each-numa-each-quadrant
selected_cpus=each-core
# a scaling curve over all the cpu cores: see documentation/cpu-selection.md#curve-a-scaling-curve
selected_cpus_scaling=curve
# each step of the curve fully loaded, one stressor per pinned logical CPU: see documentation/configuration.md#stressor_range
stressor_range=auto
skip_method=wait

[wait]
# Let's make a sleep run to see the idle behavior
# engine sleep: see documentation/sleep.md
engine=sleep
selected_cpus=1
stressor_range=1

[avx]
# engine stressng: see documentation/stressng.md#modules
engine_module=vnni
engine_module_parameter=noavx_vpaddb,avx_vpaddb512

[cpu]
# engine stressng: see documentation/stressng.md#modules
engine_module=cpu
engine_module_parameter=int128,float128,fft,int128decimal128,matrixprod

[stream]
# engine stressng: see documentation/stressng.md#modules
engine_module=stream

[memrate]
# engine stressng: see documentation/stressng.md#modules
engine_module=memrate

[qsort]
# engine stressng: see documentation/stressng.md#modules
engine_module=qsort

