# Intention: the power and thermal behaviour of the accelerators under a varying load: GPU count, datapath, memory, per card
[global]
runtime=300
monitor=all

[gpu_count_scaling]
# engine pantheon: see documentation/pantheon.md#concept
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
# every accelerator of the target machine, the GPUs to add one by one: see documentation/configuration.md#selected_gpus
selected_gpus=all
# 1, 2, 3, 4, 8 ... accelerators, cumulatively, to see how the board power adds up: see documentation/configuration.md#selected_gpus_scaling
selected_gpus_scaling=curve

[gpu_datapaths]
# engine pantheon: see documentation/pantheon.md#concept
engine=pantheon
engine_module=core
# four datapaths with very different power envelopes for the same occupancy: see documentation/pantheon.md#concept
engine_module_parameter=tensor_virus,fp64_virus,int_virus,sfu_stress
# every accelerator of the target machine: see documentation/configuration.md#selected_gpus
selected_gpus=all
# all of them loaded at once, in a single benchmark per datapath: see documentation/configuration.md#selected_gpus_scaling
selected_gpus_scaling=none

[gpu_memory]
# engine pantheon: see documentation/pantheon.md#concept
engine=pantheon
engine_module=memory
# memory rather than compute, the HBM stacks and their own thermal limit: see documentation/pantheon.md#concept
engine_module_parameter=memory_read,memory_write,memory_thermal_asym
# every accelerator of the target machine: see documentation/configuration.md#selected_gpus
selected_gpus=all
# all of them loaded at once, in a single benchmark per workload: see documentation/configuration.md#selected_gpus_scaling
selected_gpus_scaling=none

[per_gpu_health]
# engine pantheon: see documentation/pantheon.md#concept
engine=pantheon
engine_module=core
# the workload reaching the power limit, with pantheon main, so a card that cannot sustain it stands out: see documentation/pantheon.md#power-draw-of-the-workloads
engine_module_parameter=omni_virus
# every accelerator of the target machine: see documentation/configuration.md#selected_gpus
selected_gpus=all
# one benchmark per accelerator, to isolate a card slower or hotter than its peers: see documentation/configuration.md#selected_gpus_scaling
selected_gpus_scaling=iterate
