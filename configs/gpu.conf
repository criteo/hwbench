# Intention: the power and thermal behaviour of every accelerator burnt at once for 15 minutes, after an idle reference
[global]
runtime=900
monitor=all

[cool_down]
# engine sleep: see documentation/sleep.md
engine=sleep
runtime=300

[burn_all_gpus]
# engine pantheon: see documentation/pantheon.md#concept
engine=pantheon
engine_module=core
# the tensor cores, available in every pantheon release; with pantheon main, omni_virus is the one reaching the power limit: see documentation/pantheon.md#power-draw-of-the-workloads
engine_module_parameter=tensor_virus
# every accelerator of the target machine: see documentation/configuration.md#selected_gpus
selected_gpus=all
# all of them loaded at once in a single benchmark: see documentation/configuration.md#selected_gpus_scaling
selected_gpus_scaling=none
