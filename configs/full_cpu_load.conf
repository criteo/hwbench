# Intention: the power and thermal limits of the CPU fully loaded for 10 minutes, after 5 minutes idle
[global]
runtime=600
monitor=all

[cool_down]
# engine sleep: see documentation/sleep.md
engine=sleep
runtime=300

[full_cpu_load]
# engine stressng: see documentation/stressng.md#modules
engine=stressng
engine_module=cpu
engine_module_parameter=matrixprod
# every logical CPU of the target machine: see documentation/configuration.md#selected_cpus
selected_cpus=all
# all of them loaded at once in a single benchmark: see documentation/cpu-selection.md#none-load-everything-at-once
selected_cpus_scaling=none
# one matrixprod worker per logical CPU, the whole CPU fully loaded: see documentation/configuration.md#stressor_range
stressor_range=auto

