# Intention: hold every accelerator at its power and thermal limits for about 50 minutes, after an idle reference, to observe the cooling and the throttling
[global]
runtime=360
monitor=all
# every accelerator of the target machine: see documentation/configuration.md#selected_gpus
selected_gpus=all
# all of them loaded at once, in a single benchmark per workload: see documentation/configuration.md#selected_gpus_scaling
selected_gpus_scaling=none

[cool_down]
# engine sleep: see documentation/sleep.md
engine=sleep
runtime=300

[fry_cores]
# engine pantheon: see documentation/pantheon.md#concept
engine=pantheon
engine_module=core
# the five power viruses, one benchmark each; only omni_virus, with pantheon main, holds the accelerators at their power limit: see documentation/pantheon.md#power-draw-of-the-workloads
engine_module_parameter=incinerator,tensor_virus,omni_virus,pulse_virus,voltage

[fry_memory]
# engine pantheon: see documentation/pantheon.md#concept
engine=pantheon
engine_module=memory
# the HBM stacks heated unevenly then held hot, reached by traffic rather than compute: see documentation/pantheon.md#concept
engine_module_parameter=memory_thermal_asym,memory_retention_bake
