# Intention: the 4k random read performance of a NVMe disk, with 4 then 6 fio jobs
[global]
runtime=40
monitor=all

[randread_cmdline]
# engine fio: see documentation/fio.md#command-line
engine=fio
engine_module=cmdline
engine_module_parameter_base=--direct=1 --rw=randread --bs=4k --ioengine=libaio --iodepth=256 --group_reporting --readonly
# one benchmark on this disk, the --filename of fio: see documentation/configuration.md#disks
disks=/dev/nvme0n1
# fio allowed on every logical CPU of the target machine: see documentation/configuration.md#selected_cpus
selected_cpus=all
# a single pinning on all of them for each stressor count: see documentation/cpu-selection.md#none-load-everything-at-once
selected_cpus_scaling=none
# 4 then 6 fio jobs, the --numjobs of each benchmark: see documentation/fio.md#command-line
stressor_range=4,6
