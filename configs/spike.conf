# Intention: how the cooling reacts to load spikes on a growing number of physical cores
[global]
runtime=300
monitor=all

[spike]
# engine spike: see documentation/spike.md#modes
engine=spike
engine_module=cpu
engine_module_parameter_base=high:10 low:5
# every physical core of the CPU, one group each: see documentation/cpu-selection.md#each-core-each-numa-each-quadrant
selected_cpus=each-core
# the spikes repeated on a scaling curve over all the cpu cores: see documentation/cpu-selection.md#curve-a-scaling-curve
selected_cpus_scaling=curve
# each spike fully loading its cores, one stressor per pinned logical CPU: see documentation/configuration.md#stressor_range
stressor_range=auto
