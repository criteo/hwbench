[global]
runtime=30
monitor=none

[burn_all_gpus]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
selected_gpus=all
selected_gpus_scaling=none

[burn_two_gpus]
engine=pantheon
engine_module=core
engine_module_parameter=fp64_virus,tensor_virus
selected_gpus=0,1
selected_gpus_scaling=iterate
gpu_memory_percent=50
verify=false

[gpu_ladder]
engine=pantheon
engine_module=memory
engine_module_parameter=memory_read
selected_gpus=0-3
selected_gpus_scaling=curve

[whole_suite]
engine=pantheon
engine_module=ai_auxiliary
engine_module_parameter=all
selected_gpus=0,1
selected_gpus_scaling=none
