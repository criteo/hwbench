[global]
runtime=30
monitor=none

[bad_gpu_scaling]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
selected_gpus_scaling=plus_0

[bad_gpu_list]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
selected_gpus=gpu0

# The target machine has 4 GPUs
[unknown_gpu]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
selected_gpus=0,7

# none loads a single group
[several_groups_at_once]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
selected_gpus=0 1
selected_gpus_scaling=none

[bad_memory_percent]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
gpu_memory_percent=100

[bad_boolean]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
verify=maybe

[bad_platform]
engine=pantheon
engine_module=core
engine_module_parameter=tensor_virus
platform=opencl

# A test of another suite: the module scopes which workloads it accepts.
[wrong_suite]
engine=pantheon
engine_module=core
engine_module_parameter=memory_read

# The engine custom parameter comes first on purpose: everything declared after
# it must still be validated.
[custom_then_invalid_emp]
engine=pantheon
gpu_memory_percent=50
engine_module=core
engine_module_parameter=cpu_virus
