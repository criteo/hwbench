# This configuration file describes the environment of the server: its location and the credentials of its BMC and PDUs.
# They are mandatory if you want to monitor the system metrics.
# Credentials can have vendor specific values and if none found, 'default' is used.

#[HPE]
#username=Administrator
#password=YOURPASSWORD
#type=BMC

#[DELL]
#username=Administrator
#password=YOURPASSWORD
#type=BMC

[default]
username=Administrator
password=YOURPASSWORD
type=BMC

# This part locates the server: kept in results.json, to know where each run was made,
# and shown under the serial of the server in the graphs of hwgraph.
# location is the path of the places of the server, from the widest to the narrowest, cut by the separator.
# levels, optional, names these places, shown before them: a place is its value alone, like 3, not U3.
# A location of a single place, like 'Secret Lab 1', is out of the hierarchy.
# separator is '/' by default; a place left empty is not known. Without location, the server has no location.
#[Location]
#separator = /
#levels = Country / DC / DH / Room / Rack / Position
#location = FR / PA3 / 12.34 / LH1234.12 / 12.23 / 3
#location = Secret Lab 1

# This part is used to define PDUs
#[PDU_1]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=http://mypdu/
#outlet=21

#[PDU_with_grouped_outlets]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=https://mypdu/
#outletgroup=1

#[PDU_with_multiple_outlets]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=https://mypdu/
#outlet=OUTLET10,OUTLET20,OUTLET31
#group=feed A

#[PDU_with_multiple_outletgroups]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=https://mypdu/
#outletgroup=Outlet group 1,Outlet group 3
#group=feed B

#[PDU_chained]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=http://mypdu/
#outlet=21
#pdu_id=2
#group=feed B
