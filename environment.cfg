# This configuration file describes the environment of the server: its location and the credentials of its BMC and PDUs.
# They are mandatory if you want to monitor the system metrics.
# Credentials can have vendor specific values and if none found, 'default' is used.

#[HPE]
#username=Administrator
#password=YOURPASSWORD
#type=BMC

#[DELL]
#username=Administrator
#password=YOURPASSWORD
#type=BMC

[default]
username=Administrator
password=YOURPASSWORD
type=BMC

# This part locates the server: kept in results.json, to know where each run was made,
# and shown under the serial of the server in the graphs of hwgraph.
# The keys go from the widest to the narrowest, U being the height in the rack.
# Extra is a free text, like 'Secret Lab 1', set alone when this hierarchy does not match where the server is.
# A key commented, absent or empty is not set; without any, the server has no location.
#[Location]
#Country=
#Datacenter=
#Datahall=
#Room=
#Rack=
#U=
#Extra=

# This part is used to define PDUs
#[PDU_1]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=http://mypdu/
#outlet=21

#[PDU_with_grouped_outlets]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=https://mypdu/
#outletgroup=1

#[PDU_with_multiple_outlets]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=https://mypdu/
#outlet=OUTLET10,OUTLET20,OUTLET31
#group=feed A

#[PDU_with_multiple_outletgroups]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=https://mypdu/
#outletgroup=Outlet group 1,Outlet group 3
#group=feed B

#[PDU_chained]
#username=admin
#password=admin
#type=PDU
#driver=generic
#url=http://mypdu/
#outlet=21
#pdu_id=2
#group=feed B
