# Status: PRE-EXISTING on main (identical result)
# Overlapping groups built from topology keywords (review: benchmarks.py merge).
# numa0 is part of quadrant0 on the 8-domain AMD topology, so step 2 of plus_1
# merges numa0 with quadrant0.
# Expected (correct): each cpu pinned once.
# Actual: step 2 holds numa0's cpus twice, so stressor_range=auto starts more stressors
