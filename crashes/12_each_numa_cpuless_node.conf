# Status: introduced by pr-132 (each-* helpers are new); the skipped node 2 is pre-existing, see main-equivalents/d
# Warning 4: each-numa / each-quadrant emit an empty group on a topology with
# CPU-less NUMA nodes. HARDWARE DEPENDENT: the config itself is valid; it only fails
# on a machine (or mocked numactl output) with memory-only nodes (CXL, HBM), e.g.
#   node 0 cpus: 0 1 2 3
#   node 1 cpus:            <- no cpus: line not matched, node 1 missing from numa_domains
#   node 2 cpus: 4 5 6 7
# numa_domains then has ids {0, 2}, count() == 2, and range(2) visits ids 0 and 1:
# id 1 gives [], and node 2 is never selected.
# Expected (correct): only nodes with cpus are listed, or a clear fatal.
# Actual (verified with that mocked topology): each-numa gives [[0, 1, 2, 3], ['']]
# (node 2 is never selected) and each-quadrant gives [[0, 1, 2, 3], [''], [4, 5, 6, 7]].
# With plus_1 (this file): TypeError from sorted() mixing '' and ints in
# Benchmarks.parse_jobs_config. With selected_cpus_scaling=iterate instead:
# ValueError int('') in EngineModulePinnable.validate_module_parameters.
# Reproduce by pairing this file with a mocked numactl output like the one above
# (see hwbench/tests/parsing/numa/ for the fixture format).
[global]
runtime=1
monitor=none
engine=stressng
engine_module=cpu
engine_module_parameter=int64
stressor_range=auto

[each_numa_cpuless]
selected_cpus=each-numa
selected_cpus_scaling=plus_1

[each_quadrant_cpuless]
selected_cpus=each-quadrant
selected_cpus_scaling=plus_1
