# Status: introduced by pr-132 (main validated selected_cpus first; see main-equivalents/c)
# Warning 2: scaling() called with no items, selected_cpus_scaling validated first.
# 1-2-3 is not a valid range, parse_range() drops it and returns [].
# selected_cpus_scaling comes before selected_cpus in the section, so its validator
# runs first and calls scaling() with items=[].
# Expected (correct): clean "Job ...: keyword ...: ..." fatal.
# Actual: uncaught IndexError traceback (items[0] on an empty list).
[global]
runtime=1
monitor=none
engine=sleep
stressor_range=auto

[empty_items_scaling_first]
selected_cpus_scaling=curve
selected_cpus=1-2-3
