# Status: introduced by pr-132 (stressor curve is new); the silent empty-range case is pre-existing, see 08
# Warning 2: empty stressor_range with curve (1-8-2 is not a valid range -> []).
# validate_stressor_range accepts anything, and scaling() returns [[]] for curve.
# Expected (correct): clean job error during validation.
# Actual: validation passes, then IndexError in Benchmarks.__schedule_benchmarks
# at stressor_range[step[-1]] while expanding the job.
[global]
runtime=1
monitor=none
engine=sleep

[empty_stressors_curve]
stressor_range=1-8-2
stressor_range_scaling=curve
