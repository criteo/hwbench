# Status: PRE-EXISTING on main (identical result)
# Warning 3 (silent variant): an empty cpu group with iterate (the default scaling).
# Expected (correct): "empty group of cpus" job error.
# Actual (verified): no error. Two benchmarks are scheduled: 4 cpus / 4 stressors, then
# 0 cpus / 0 stressors (pinned on []). With the stressng engine that second benchmark is
# unpinned (get_taskset adds no taskset for []) and --cpu 0 starts one stressor per
# online cpu (checked with stress-ng 0.19.02), so it loads the whole machine.
[global]
runtime=1
monitor=none
engine=sleep
stressor_range=auto

[empty_group_iterate]
selected_cpus=0-3 7-4
selected_cpus_scaling=iterate
