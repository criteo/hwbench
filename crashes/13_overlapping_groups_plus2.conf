# Status: PRE-EXISTING on main (identical result)
# Overlapping cpu groups merged by a plus_<x> step (review: benchmarks.py merge).
# 0-3 and 2-5 share cpus 2 and 3; plus_2 merges both groups into one step.
# Expected (correct): duplicates removed (6 cpus) or overlapping groups rejected.
# Actual: pinned_cpu keeps the duplicates, [0,1,2,2,3,3,4,5], so stressor_range=auto
# starts 8 stressors for 6 distinct cpus and the engine gets the duplicated list.
# Not a regression: the removed code also kept duplicates.
[global]
runtime=1
monitor=none
engine=sleep
stressor_range=auto

[overlapping_groups]
selected_cpus=0-3 2-5
selected_cpus_scaling=plus_2
