# Status: introduced by pr-132 (curve is new); the empty group itself is pre-existing, see 10 and 11
# Warning 3: an empty cpu group in a curve.
# 7-4 is a reversed range -> parse_range() gives the group []. validate_selected_cpus
# accepts it because the overall result is not empty.
# Expected (correct): clean "empty group of cpus" job error.
# Actual: uncaught IndexError in the socket-boundary comprehension
# (items[index + 1][0] on []), even on a single-socket machine.
[global]
runtime=1
monitor=none
engine=sleep
stressor_range=auto

[empty_group_curve]
selected_cpus=0-3 7-4
selected_cpus_scaling=curve
