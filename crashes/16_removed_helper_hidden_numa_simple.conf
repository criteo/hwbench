# Status: introduced by pr-132 (main still supports 'numa-simple')
# Same ordering problem as 15, with the removed helper "numa-simple".
# Expected (correct): "numa-simple was removed, use selected_cpus=each-numa with
# selected_cpus_scaling=plus_1".
# Actual: "numa-" is matched as a numa resource and the error is a confusing
# "Non-numeric range ['', ''] in '-'".
[global]
runtime=1
monitor=none
engine=sleep
stressor_range=auto

[removed_numa_simple]
selected_cpus_scaling=iterate
selected_cpus=numa-simple
