# Status: introduced by pr-132 (main still supports 'simple')
# Validation order hides the migration message (review: config_syntax.py ordering).
# selected_cpus_scaling is written before selected_cpus, so its validator runs first and
# calls get_selected_cpus() on the removed helper "simple".
# Expected (correct): "simple was removed, use selected_cpus=each-core with
# selected_cpus_scaling=curve".
# Actual: generic "The following keywords, didn't get processed ! : ['simple']".
# The same job with the keywords swapped gets the migration message.
[global]
runtime=1
monitor=none
engine=sleep
stressor_range=auto

[removed_simple]
selected_cpus_scaling=iterate
selected_cpus=simple
