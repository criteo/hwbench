# Status: introduced by pr-132 (main: clean 'Unsupported stressor_range_scaling')
# Warning 1: the literal placeholder plus_<x> is accepted for stressor_range_scaling.
# Expected (correct): "unknown value plus_<x>" job error.
# Actual: no error, silently runs as "curve" (stressor counts 1,2,3,4,8,16,32,48,64
# instead of one benchmark per count).
[global]
runtime=1
monitor=none
engine=sleep

[placeholder_stressors]
stressor_range=1-64
stressor_range_scaling=plus_<x>
